[project]
name = "vrox-voice-agent"
version = "1.0.0"
description = "A friendly, free, local Hindi/English voice companion that can chat and control your PC."
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
