<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vrox — your voice companion</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #101317;
    --card: #1a1e24;
    --accent: #7c9eff;
    --accent-soft: #4a5a8a;
    --text: #eef1f5;
    --muted: #9aa4b2;
    --skin: #f2c19b;
    --skin-shadow: #dba374;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }

  /* ---------- Avatar ---------- */
  #avatarWrap {
    position: relative;
    width: 170px;
    height: 170px;
    margin: 0 auto 18px;
  }
  #avatarRing {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid var(--accent);
    opacity: 0;
    transform: scale(0.85);
  }
  #avatarWrap.listening #avatarRing {
    animation: ringPulse 1.1s ease-out infinite;
  }
  @keyframes ringPulse {
    0%   { opacity: 0.7; transform: scale(0.85); }
    100% { opacity: 0;   transform: scale(1.25); }
  }
  #avatar {
    width: 100%;
    height: 100%;
    animation: bob 3.2s ease-in-out infinite;
    transform-origin: 50% 60%;
  }
  #avatarWrap.listening #avatar { animation: bob 0.9s ease-in-out infinite; }
  #avatarWrap.thinking #avatar { animation: tilt 1.4s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-5px) scale(1.015); }
  }
  @keyframes tilt {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-4deg); }
    75%      { transform: rotate(4deg); }
  }

  #eyeLeft, #eyeRight { animation: blink 4.5s ease-in-out infinite; transform-origin: center; }
  #eyeRight { animation-delay: 0.05s; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.1); }
  }
  #avatarWrap.thinking #eyeLeft,
  #avatarWrap.thinking #eyeRight { animation: lookAround 1.4s ease-in-out infinite; }
  @keyframes lookAround {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(2px); }
  }

  #mouth {
    transform-origin: center;
    transition: d 0.1s ease;
  }
  #avatarWrap.talking #mouth { animation: talk 0.32s ease-in-out infinite; }
  @keyframes talk {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(2.2); }
  }

  #thinkingDots { opacity: 0; }
  #avatarWrap.thinking #thinkingDots { opacity: 1; }
  #thinkingDots circle { animation: dotFade 1.2s ease-in-out infinite; }
  #thinkingDots circle:nth-child(2) { animation-delay: 0.15s; }
  #thinkingDots circle:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotFade {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  /* ---------- Controls ---------- */
  #talkBtn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #0b0e13;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 0 0 rgba(124,158,255,0.5);
  }
  #talkBtn.recording {
    background: #ff6b6b;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,107,107,0.5); }
    70% { box-shadow: 0 0 0 20px rgba(255,107,107,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,107,107,0); }
  }
  #status { margin-top: 16px; min-height: 1.4em; color: var(--muted); font-size: 0.9rem; }
  .bubble {
    text-align: left;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #10141a;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .bubble .label { color: var(--accent); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎙️ Vrox</h1>
    <p class="subtitle">Your friendly voice companion — hold the button and speak, in Hindi or English.</p>

    <div id="avatarWrap">
      <div id="avatarRing"></div>
      <svg id="avatar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- headset -->
        <path d="M40 95 a60 60 0 0 1 120 0" fill="none" stroke="#5b6577" stroke-width="7" stroke-linecap="round"/>
        <rect x="30" y="88" width="14" height="26" rx="7" fill="#5b6577"/>
        <rect x="156" y="88" width="14" height="26" rx="7" fill="#5b6577"/>
        <rect x="150" y="118" width="10" height="22" rx="5" fill="#5b6577" transform="rotate(20 155 129)"/>
        <circle cx="158" cy="142" r="6" fill="var(--accent)"/>

        <!-- face -->
        <circle cx="100" cy="108" r="62" fill="var(--skin)"/>
        <path d="M38 108 a62 62 0 0 0 124 0 z" fill="var(--skin-shadow)" opacity="0.25"/>

        <!-- eyes -->
        <g id="eyeLeft"><ellipse cx="76" cy="100" rx="8" ry="10" fill="#2b2f38"/></g>
        <g id="eyeRight"><ellipse cx="124" cy="100" rx="8" ry="10" fill="#2b2f38"/></g>

        <!-- eyebrows: friendly but grounded -->
        <path d="M64 82 q12 -8 24 -1" stroke="#6b4a2f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M112 81 q12 -7 24 1" stroke="#6b4a2f" stroke-width="4" fill="none" stroke-linecap="round"/>

        <!-- mustache: a bit of "heavy" charm -->
        <path d="M72 122 q28 14 56 0 q-6 12 -28 12 q-22 0 -28 -12 z" fill="#4a3527"/>

        <!-- mouth -->
        <rect id="mouth" x="90" y="140" width="20" height="6" rx="3" fill="#7a3b32"/>

        <!-- thinking dots -->
        <g id="thinkingDots">
          <circle cx="130" cy="60" r="4" fill="var(--accent)"/>
          <circle cx="145" cy="55" r="4" fill="var(--accent)"/>
          <circle cx="160" cy="52" r="4" fill="var(--accent)"/>
        </g>
      </svg>
    </div>

    <button id="talkBtn">🎤 Hold to talk</button>
    <div id="status">Ready</div>

    <div id="transcriptBubble" class="bubble" style="display:none;">
      <div class="label">You said</div>
      <div id="transcriptText"></div>
    </div>
    <div id="replyBubble" class="bubble" style="display:none;">
      <div class="label">Vrox</div>
      <div id="replyText"></div>
    </div>

    <audio id="player" style="display:none;"></audio>
  </div>

<script>
const talkBtn = document.getElementById('talkBtn');
const statusEl = document.getElementById('status');
const avatarWrap = document.getElementById('avatarWrap');
const transcriptBubble = document.getElementById('transcriptBubble');
const transcriptText = document.getElementById('transcriptText');
const replyBubble = document.getElementById('replyBubble');
const replyText = document.getElementById('replyText');
const player = document.getElementById('player');

let mediaRecorder;
let chunks = [];

function setAvatarState(state) {
  // states: idle | listening | thinking | talking
  avatarWrap.classList.remove('listening', 'thinking', 'talking');
  if (state !== 'idle') avatarWrap.classList.add(state);
}

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);
  chunks = [];
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();
  talkBtn.classList.add('recording');
  talkBtn.textContent = '🔴 Listening...';
  statusEl.textContent = 'Listening...';
  setAvatarState('listening');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach((t) => t.stop());
  }
  talkBtn.classList.remove('recording');
  talkBtn.textContent = '🎤 Hold to talk';
}

async function onRecordingStop() {
  statusEl.textContent = 'Thinking...';
  setAvatarState('thinking');
  const blob = new Blob(chunks, { type: 'audio/webm' });
  const form = new FormData();
  form.append('audio', blob, 'clip.webm');

  try {
    const res = await fetch('/api/talk', { method: 'POST', body: form });
    const data = await res.json();

    if (data.transcript) {
      transcriptBubble.style.display = 'block';
      transcriptText.textContent = data.transcript;
    }
    if (data.reply) {
      replyBubble.style.display = 'block';
      replyText.textContent = data.reply;
    }
    if (data.audio_base64) {
      player.src = 'data:audio/mpeg;base64,' + data.audio_base64;
      player.play();
    } else {
      setAvatarState('idle');
      statusEl.textContent = 'Ready';
    }
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Something went wrong — is the server running?';
    setAvatarState('idle');
  }
}

player.addEventListener('play', () => {
  setAvatarState('talking');
  statusEl.textContent = 'Speaking...';
});
player.addEventListener('ended', () => {
  setAvatarState('idle');
  statusEl.textContent = 'Ready';
});
player.addEventListener('pause', () => {
  setAvatarState('idle');
});

talkBtn.addEventListener('mousedown', startRecording);
talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
talkBtn.addEventListener('mouseup', stopRecording);
talkBtn.addEventListener('mouseleave', () => { if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(); });
talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
</script>
</body>
</html>
